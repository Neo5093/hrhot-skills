name: verify-mirror

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 1 * * *' # 每日 UTC 01:00（北京时间 09:00）
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # V2.2.1 可达性探测：站内部署在 EdgeOne 大陆可用区，GitHub runner（境外）可能无法访问——
      # 不可达时跳过镜像校验（job 转绿，不发失败告警），一致性由发布流程的本地校验兜底；
      # 可达时（手动 dispatch 或网络可达）执行完整字节校验。
      - name: Probe live reachability
        id: probe
        run: |
          if curl -fsSL --max-time 15 --retry 2 --retry-all-errors \
              "https://hrhot.gaiying.top/hrhot-skill/manifest.sha256" \
              -o live-manifest.sha256; then
            echo "reachable=true" >> "$GITHUB_OUTPUT"
          else
            echo "reachable=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch live copy and verify byte-identity
        if: steps.probe.outputs.reachable == 'true'
        run: |
          BASE="https://hrhot.gaiying.top/hrhot-skill"
          # live-manifest.sha256 已由探测步骤落盘（避免重复拉取）
          # 逐文件下载线上副本（保留 manifest 内相对路径结构；兼容 '*file' 二进制标记）
          awk '{ f = $2; sub(/^\*/, "", f); print f }' live-manifest.sha256 | while read -r f; do
            mkdir -p "$(dirname "live/$f")"
            curl -fsSL --retry 2 --retry-all-errors "$BASE/$f" -o "live/$f"
          done
          # 1) 线上副本逐文件验签（证明线上副本自洽）
          (cd live && sha256sum -c ../live-manifest.sha256)
          # 2) 线上副本与本仓库逐文件比对（证明镜像与站内字节一致）
          awk '{ f = $2; sub(/^\*/, "", f); print f }' live-manifest.sha256 | while read -r f; do
            diff -q "$f" "live/$f" || { echo "MISMATCH: $f"; exit 1; }
          done
          echo "OK: GitHub mirror is byte-identical to live copy."

      - name: Live unreachable — skip mirror check
        if: steps.probe.outputs.reachable != 'true'
        run: |
          echo "⚠️ 站内（hrhot.gaiying.top，EdgeOne 大陆可用区）从 GitHub runner（境外）不可达。"
          echo "本次跳过镜像校验；一致性由发布流程的本地校验兜底（发布时按 git 对象字节同步+重签 manifest）。"
          echo "如需深度校验，请在境内网络环境手动触发（workflow_dispatch）。"
